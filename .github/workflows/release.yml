name: Release

on:
  push:
    branches: [main]
    paths:
      - "release/**"
      - "CHANGELOG.md"
      - ".github/workflows/release.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VER=$(grep '^Version:' control | awk '{print $2}')
          TAG="v$VER"
          UPLOAD_FILE="release/SplashAway.dylib"
          cp "release/开屏广告走开.dylib" "$UPLOAD_FILE"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release delete-asset "$TAG" default.dylib --yes >/dev/null 2>&1 || true
            gh release upload "$TAG" "$UPLOAD_FILE" --clobber
            exit 0
          fi
          awk -v tag="## $TAG" '$0==tag{flag=1;next} /^## /{flag=0} flag' CHANGELOG.md > notes.md
          if [ ! -f "$UPLOAD_FILE" ]; then
            echo "no release files for $VER"
            exit 1
          fi
          gh release create "$TAG" "$UPLOAD_FILE" \
            --target "$GITHUB_SHA" \
            --title "开屏广告走开 $TAG" \
            --notes-file notes.md
