name: Release

on:
  push:
    branches: [main]
    paths:
      - "release/**"
      - "CHANGELOG.md"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VER=$(grep '^Version:' control | awk '{print $2}')
          TAG="v$VER"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "$TAG already exists, skipping"
            exit 0
          fi
          awk -v tag="## $TAG" '$0==tag{flag=1;next} /^## /{flag=0} flag' CHANGELOG.md > notes.md
          shopt -s nullglob
          FILES=(release/*.dylib)
          if [ ${#FILES[@]} -eq 0 ]; then
            echo "no release files for $VER"
            exit 1
          fi
          gh release create "$TAG" "${FILES[@]}" \
            --target "$GITHUB_SHA" \
            --title "开屏广告走开 $TAG" \
            --notes-file notes.md
